  @font-face {
    font-family: "Inter Tight";

    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f4f3ef;
    --ink: #171717;
    --mute: #888680;
    --gutter: clamp(24px, 4.2vw, 52px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: clamp(22px, 3.6vh, 44px) var(--gutter) clamp(20px, 3.4vh, 40px);
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: var(--ink); color: var(--bg); }

  .wordmark {
    font-size: clamp(21px, 2.4vw, 29px);
    font-weight: 650;
    letter-spacing: -0.038em;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: clamp(20px, 4vh, 48px);
  }

  .circles {
    display: flex;
    gap: clamp(20px, 3.8vw, 44px);
  }

  .circles svg {
    width: clamp(104px, 17.6vw, 200px);
    height: auto;
    display: block;
  }

  .belief {
    margin-top: clamp(34px, 7.4vh, 62px);
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: clamp(16px, 1.7vw, 22px);
    text-align: center;
    text-wrap: balance;
    display: grid;
  }

  .belief .line {
    grid-area: 1 / 1;
    transition: opacity 0.45s ease;
  }

  .belief .design,
  .belief .nature { opacity: 0; }

  main:has(.c-left:hover) .line.default,
  main:has(.c-right:hover) .line.default { opacity: 0; }

  main:has(.c-left:hover) .line.design { opacity: 1; }
  main:has(.c-right:hover) .line.nature { opacity: 1; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    font-size: 13px;
    letter-spacing: 0.015em;
    color: var(--mute);
  }

  footer a {
    color: inherit;
    text-decoration: none;
    transition: color 0.35s ease;
  }

  footer a:hover { color: var(--ink); }

  footer a:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 4px;
  }

  @keyframes arrive {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  body > * { animation: arrive 1.4s ease both; }

  @media (max-width: 420px) {
    footer { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body > * { animation: none; }
    * { transition: none !important; }
  }
</style>
