<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontitled — We make old giants dance again.</title>
<meta name="description" content="Ontitled. We make old giants dance again.">
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta property="og:title" content="Ontitled">
<meta property="og:description" content="We make old giants dance again.">
<meta property="og:type" content="website">
<style>
  @font-face {
    font-family: "Inter Tight";
    src: url("/fonts/inter-tight-latin.woff2") format("woff2");
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #080808;
    --ink: #edeae1;
    --muted: #8a857a;
    --tan: #c2ab86;
    --tan-hi: #dcc9a8;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --gutter: clamp(24px, 6.5vw, 104px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100svh;
    display: grid;
    align-content: center;
    padding: clamp(56px, 9vh, 104px) var(--gutter);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: var(--tan); color: #0b0b0b; }

  .hero {
    position: relative;
    z-index: 1;
    max-width: 940px;
  }

  .mark {
    width: clamp(58px, 5.6vw, 84px);
    color: var(--tan);
  }
  /* Optical alignment: the bracket, not the SVG box, sits on the text axis */
  .mark svg { display: block; width: 100%; height: auto; transform: translateX(-13%); }

  h1 {
    margin-top: clamp(30px, 4.2vw, 52px);
    font-size: clamp(34px, 6.7vw, 96px);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.04em;
    text-wrap: balance;
  }

  h1 span { display: block; }
  h1 .line-two { color: var(--tan); }

  .cta {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(26px, 3.4vw, 44px);
    margin-top: clamp(32px, 4.2vw, 50px);
    font-size: 14px;
    letter-spacing: 0.002em;
  }

  .cta a {
    position: relative;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding-bottom: 5px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .cta a:first-child { color: var(--ink); }

  .cta a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: currentColor;
    opacity: 0.26;
    transform-origin: left;
    transition: opacity 0.3s ease;
  }

  .cta a:hover { color: var(--tan-hi); }
  .cta a:hover::after { opacity: 0.55; }

  .cta a:focus-visible {
    outline: 1px solid var(--tan);
    outline-offset: 5px;
  }

  .cta .arrow {
    font-size: 0.94em;
    transition: transform 0.4s var(--ease);
  }
  .cta a:hover .arrow { transform: translateX(3px); }

  @keyframes settle {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .mark, h1, .cta { animation: settle 0.9s ease both; }
  h1 { animation-delay: 0.06s; }
  .cta { animation-delay: 0.12s; }

  @media (max-width: 560px) {
    h1 { font-size: clamp(32px, 9.4vw, 44px); letter-spacing: -0.03em; line-height: 1.02; }
    .cta { font-size: 13.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark, h1, .cta { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="miter">
        <path d="M31 21 H13 V79 H31"/>
        <path d="M69 21 H87 V79 H69"/>
        <circle cx="50" cy="41" r="10.5"/>
        <path d="M39.5 79 V71.5 A10.5 10.5 0 0 1 60.5 71.5 V79"/>
      </svg>
    </div>

    <h1>
      <span>We make old giants</span>
      <span class="line-two">dance again.</span>
    </h1>

    <div class="cta">
      <a href="#">Read vision <span class="arrow" aria-hidden="true">→</span></a>
      <a href="#">Announcement <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
