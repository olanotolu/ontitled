<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ontitled — 1998</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    font-family: "Courier New", Courier, monospace;
    color: #000;
  }
  body {
    display: grid;
    place-items: center;
  }
  .window {
    width: min(560px, 90vw);
    border: 2px solid #000;
    box-shadow: 4px 4px 0 #000;
    background: #fff;
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 6px;
    border-bottom: 2px solid #000;
    font-size: 12px;
    letter-spacing: 1px;
    background:
      repeating-linear-gradient(
        to bottom, #fff 0 2px, #000 2px 3px
      );
  }
  .titlebar .box {
    width: 10px;
    height: 10px;
    border: 1px solid #000;
    background: #fff;
    flex: none;
  }
  .titlebar .name {
    flex: 1;
    text-align: center;
    background: #fff;
    padding: 0 6px;
  }
  .pane {
    padding: 48px 24px 40px;
    text-align: center;
  }
  h1 {
    margin: 0 0 18px;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: 2px;
  }
  .tagline {
    margin: 0;
    font-size: 14px;
  }
  .cursor {
    display: inline-block;
    width: 9px;
    height: 15px;
    margin-left: 2px;
    background: #000;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .status {
    border-top: 2px solid #000;
    padding: 3px 8px;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="window" role="img" aria-label="Ontitled — For the Future Has No Title">
    <div class="titlebar">
      <span class="box"></span>
      <span class="name">ontitled.sys</span>
      <span class="box"></span>
    </div>
    <div class="pane">
      <h1>[Ontitled]</h1>
      <p class="tagline">For the Future Has No Title<span class="cursor"></span></p>
    </div>
    <div class="status">
      <span>ready</span>
      <span>1998</span>
    </div>
  </div>
</body>
</html>
